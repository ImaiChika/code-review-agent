# CI 门禁（PROJECT_GUIDE §7.2 M0 / §7.3 A7+D1 前半）
#
# 纪律：任何一项红了不合入。数据集质量门禁包含在 go test 全量运行中
# （TestDataset*），脱敏 0 泄漏在 M0-A1 之后已转为硬门禁。
#
# 自举（D1）：PR diff 用本工具审查——吃自己的狗粮；
# 高危发现使 job 失败，报告作为 artifact 留存。

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: gofmt / vet / test-race（含数据集门禁）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt 检查
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 前端 JS 语法检查（node --check）
        run: node --check server/web/app.js

      - name: 全量测试（-race，含数据集质量门禁）
        run: go test ./... -count=1 -race -timeout 10m -v

  commit-check:
    name: 提交信息 Conventional Commits 校验
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验 PR 中的所有提交信息
        run: scripts/check_commits.sh "origin/${{ github.base_ref }}..HEAD"

  self-review:
    name: CI 自举（本工具审查本仓库 PR diff）
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 生成 PR diff
        run: git diff "origin/${{ github.base_ref }}...HEAD" > pr.diff

      - name: 自举审查（--dry-run，不落库）
        run: |
          go build -o code-review-agent .
          ./code-review-agent --diff-file pr.diff --dry-run --output self-review --verbose

      - name: 高危门禁（高危 ≥1 则失败）
        run: |
          count=$(python3 -c "import json; print(json.load(open('self-review/review_report.json'))['summary']['by_severity'].get('high', 0))")
          echo "高危发现: $count"
          test "$count" -eq 0 || { echo "❌ 自举审查发现高危问题，详见 artifact 报告"; exit 1; }

      - name: 上传审查报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-review-report
          path: self-review/

  sandbox-staticcheck:
    name: 沙箱实机验证（Docker + staticcheck）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: cr-sandbox 镜像构建 + staticcheck 实机验证
        run: scripts/verify_staticcheck_live.sh

      - name: 上传验证报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staticcheck-live-report
          path: .run/staticcheck-live/review_report.json
          if-no-files-found: ignore

  server-image:
    name: 服务镜像实机验证（Dockerfile.server + compose 配置）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建服务镜像（多阶段，CGO）
        run: docker build -f Dockerfile.server -t code-review-agent:ci .

      - name: 容器启动 + 健康检查 + 认证验证
        run: |
          docker run -d --name cra-ci -p 8080:8080 \
            -e AUTH_TOKEN=ci-secret-token \
            -v cra-ci-data:/data code-review-agent:ci
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8080/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8080/api/health
          echo
          # 无 token 写操作应 401；带 token 应 202
          code1=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/reviews \
            -H 'Content-Type: application/json' -d '{"diff_content":""}')
          code2=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/reviews \
            -H 'X-Auth-Token: ci-secret-token' -H 'Content-Type: application/json' \
            -d '{"diff_content":"--- a/x.go\n+++ b/x.go\n@@ -1,2 +1,3 @@\n package x\n \n+var ok = 1\n"}')
          echo "no-token=$code1 with-token=$code2"
          test "$code1" = "401" && test "$code2" = "202"

      - name: 数据卷持久化验证（容器重建后数据仍在）
        run: |
          docker rm -f cra-ci
          docker run -d --name cra-ci2 -p 8080:8080 \
            -e AUTH_TOKEN=ci-secret-token \
            -v cra-ci-data:/data code-review-agent:ci
          sleep 3
          count=$(curl -sf 'http://localhost:8080/api/tasks?limit=10' | python3 -c 'import json,sys; print(json.load(sys.stdin)["count"])')
          echo "重启后任务数: $count"
          test "$count" -ge 1
          docker rm -f cra-ci2
          docker volume rm cra-ci-data
